<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Health Assistant</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f4f7;
      color: #333;
      transition: 0.3s;
    }

    header {
      background-color: rgba(0, 68, 102, 0.9);
      color: white;
      padding: 15px;
      text-align: center;
      border-bottom: 5px solid #007acc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    main {
      padding: 15px;
      max-width: 850px;
      margin: auto;
    }

    section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    textarea, input, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 18px;
      margin-top: 15px;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #005fa3;
    }

    #aiResponse {
      margin-top: 15px;
      background-color: #e0f7fa;
      padding: 10px;
      border-left: 4px solid #007acc;
      border-radius: 4px;
    }

    iframe {
      width: 100%;
      height: 350px;
      border-radius: 10px;
    }

    .emergency {
      background: #ffe5e5;
      text-align: center;
    }

    #sosBtn {
      background-color: red;
    }

    #sosBtn:hover {
      background-color: darkred;
    }

    /* Dark Theme */
    body.dark {
      background-color: #121212;
      color: #eee;
    }
    body.dark section {
      background-color: #1e1e1e;
      color: #fff;
    }
    body.dark #aiResponse {
      background-color: #333;
      border-left-color: #00bcd4;
    }
    body.dark header {
      background-color: #222;
      border-bottom-color: #00bcd4;
    }
    body.dark button {
      background-color: #00bcd4;
    }
    body.dark button:hover {
      background-color: #0097a7;
    }

    /* Extra Mobile Responsiveness */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
      }
      button, input, textarea, select {
        font-size: 14px;
      }
    }
  </style>
</head>


<body>

<header>
  <div>
    <h1>🌍 Virtual Health Assistant</h1>
    <p>Reliable medical guidance for refugees and displaced communities.</p>
  </div>

  <button id="themeToggle">🌗 Theme</button>
</header>

<main>

<!-- USER PROFILE -->
<section>
  <h2>👤 User Profile</h2>

  <form id="profileForm">
    <input type="number" id="age" placeholder="Age" required>
    <select id="gender" required>
      <option value="">Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    <input type="text" id="allergies" placeholder="Allergies (comma separated)">
    <button type="submit">Save Profile</button>
  </form>

  <div id="profileDisplay"><em>No profile saved yet.</em></div>
</section>

<!-- SYMPTOM CHECKER -->
<section>
  <h2>🩺 Symptom Checker</h2>

  <form id="symptomForm">
    <textarea id="symptoms" rows="4" placeholder="E.g., fever, cough, chest pain..."></textarea>
    <button type="submit">Submit</button>
  </form>

  <div id="aiResponse"></div>
</section>

<!-- MAP -->
<section>
  <h2>🏥 Nearby Doctors / Hospitals</h2>
  <iframe id="mapFrame" src="https://www.google.com/maps?q=hospitals+near+me&output=embed"></iframe>
</section>

<!-- SOS -->
<section class="emergency">
  <h2>🚨 Emergency Help</h2>
  <button id="sosBtn">SOS – Get Help Now</button>
</section>

</main>


<footer style="text-align:center;padding:10px;background:#ddd;">
  🌱 UN SDG 3 | 10 | 16
</footer>

<script>

// PROFILE
let userProfile = {};
const profileDisplay = document.getElementById("profileDisplay");

document.getElementById("profileForm").addEventListener("submit", e => {
  e.preventDefault();
  userProfile = {
    age: document.getElementById("age").value,
    gender: document.getElementById("gender").value,
    allergies: document.getElementById("allergies").value
  };

  profileDisplay.innerHTML = `
    <strong>Saved Profile:</strong><br>
    Age: ${userProfile.age} <br>
    Gender: ${userProfile.gender} <br>
    Allergies: ${userProfile.allergies || "None"}
  `;
});

// SYMPTOM CHECKER
document.getElementById("symptomForm").addEventListener("submit", e => {
  e.preventDefault();

  const symptoms = document.getElementById("symptoms").value.toLowerCase().trim();
  const responseBox = document.getElementById("aiResponse");
  const mapFrame = document.getElementById("mapFrame");

  if (!symptoms) {
    responseBox.innerHTML = "<strong>Please enter symptoms.</strong>";
    return;
  }

  let advice = "";
  let doctor = "";
  let mapQuery = "hospitals near me";

  if (symptoms.includes("fever") || symptoms.includes("cough")) {
    advice = "Possible viral infection. Stay hydrated and rest.";
    doctor = "General Physician";
    mapQuery = "general physician near me";

  } else if (symptoms.includes("chest pain")) {
    advice = "Possible heart/lung issue. If severe, seek emergency help.";
    doctor = "Cardiologist";
    mapQuery = "cardiologist near me";

  } else if (symptoms.includes("vomit") || symptoms.includes("diarrhea")) {
    advice = "Likely stomach issue. Drink oral rehydration fluids.";
    doctor = "Gastroenterologist";
    mapQuery = "gastroenterologist near me";

  } else {
    advice = "Your symptoms need a doctor's evaluation.";
    doctor = "General Physician";
  }

  if (userProfile.age) {
    advice += `<br><br><em>Note: Tailored for age ${userProfile.age}, gender ${userProfile.gender}.</em>`;
  }

  responseBox.innerHTML = `
    <strong>Suggestions:</strong> ${advice}<br><br>
    <strong>Recommended Doctor:</strong> ${doctor}
  `;

  mapFrame.src = `https://www.google.com/maps?q=${encodeURIComponent(mapQuery)}&output=embed`;
});

// SOS BUTTON
document.getElementById("sosBtn").addEventListener("click", () => {
  if (confirm("Call emergency services?")) {
    window.location.href = "tel:112";
  } else {
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      const message = `🚨 I need help! My location: https://maps.google.com/?q=${lat},${lon}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(message)}`);
    });
  }
});

// THEME TOGGLE
document.getElementById("themeToggle").addEventListener("click", () => {
  document.body.classList.toggle("dark");
});

</script>

</body>
</html>
